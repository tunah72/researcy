[project]
name = "researcy-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15.2,<2",
  "authlib>=1.4,<2",
  "fastapi>=0.115.12,<1",
  "httpx2>=2.13.1",
  "minio>=7.2.15,<8",
  "pymupdf>=1.25.3,<2",
  "psycopg[binary]>=3.2.6,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3.5,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
